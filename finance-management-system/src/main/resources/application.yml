spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/gnucash_test?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: root # 替换为你的数据库用户名
    password: 123456 # 替换为你的数据库密码
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000

mybatis:
  mapper-locations: classpath:mapper/*.xml # 如果有XML映射文件
  type-aliases-package: com.fGnucash.domain
  configuration:
    map-underscore-to-camel-case: false # 保持与原配置一致
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 可选，用于日志输出

server:
  port: 8080 # 服务器端口
  servlet:
    context-path: / # 上下文路径